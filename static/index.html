<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIDOO ABM066 LCD Tool</title>
  <link rel="stylesheet" href="style.css">
  <script src="omggif.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="4" width="20" height="16" rx="3" />
          <path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M8 16h8" />
        </svg>
      </div>
      <div>
        <h1>CIDOO ABM066</h1>
        <span class="subtitle">LCD Screen Customizer</span>
      </div>
    </div>

    <div class="header-actions">
      <div id="deviceStatusBadge" class="status-badge checking">
        <span class="status-dot"></span>
        <span id="statusText">Checking connection...</span>
      </div>
      <button id="btnSyncTime" class="btn btn-secondary" title="Sync current Mac time to keyboard clock">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <polyline points="12 6 12 12 16 14" />
        </svg>
        <span>Sync Time</span>
      </button>
    </div>
  </header>

  <main class="main-container">
    <!-- Left Column: Display Screen & Playback -->
    <section class="card preview-card">
      <div class="card-header">
        <h2>Screen Preview (96 × 160 • Portrait)</h2>
        <div class="scale-toggle">
          <button id="scale1x" class="scale-btn active">1×</button>
          <button id="scale2x" class="scale-btn">2×</button>
          <button id="scale3x" class="scale-btn">3×</button>
        </div>
      </div>

      <div class="screen-wrapper">
        <div class="screen-bezel" id="screenBezel">
          <canvas id="screenCanvas" width="96" height="160"></canvas>
          <div id="screenEmptyPrompt" class="screen-empty-prompt">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <circle cx="8.5" cy="8.5" r="1.5" />
              <polyline points="21 15 16 10 5 21" />
            </svg>
            <p>No image loaded</p>
          </div>
        </div>
      </div>

      <!-- Playback Controls (visible when GIF loaded) -->
      <div id="playbackControls" class="playback-controls hidden">
        <div class="scrubber-row">
          <input type="range" id="frameScrubber" min="0" max="0" value="0" step="1">
          <span id="frameCounter">Frame 1 / 1</span>
        </div>

        <div class="playback-buttons">
          <button id="btnPrevFrame" class="icon-btn" title="Previous Frame">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="11 17 6 12 11 7" />
              <polyline points="18 17 13 12 18 7" />
            </svg>
          </button>
          <button id="btnPlayPause" class="icon-btn primary" title="Play / Pause">
            <svg id="iconPlay" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3" />
            </svg>
            <svg id="iconPause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" class="hidden">
              <rect x="6" y="4" width="4" height="16" />
              <rect x="14" y="4" width="4" height="16" />
            </svg>
          </button>
          <button id="btnNextFrame" class="icon-btn" title="Next Frame">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="13 17 18 12 13 7" />
              <polyline points="6 17 11 12 6 7" />
            </svg>
          </button>
        </div>

        <div class="speed-control">
          <label for="speedSlider">Animation Speed: <span id="speedValue">40</span> ms</label>
          <input type="range" id="speedSlider" min="20" max="200" step="5" value="40">
          <div class="speed-presets">
            <button class="preset-btn" data-speed="25">Fast (25ms)</button>
            <button class="preset-btn active" data-speed="40">Smooth (40ms)</button>
            <button class="preset-btn" data-speed="60">Normal (60ms)</button>
            <button class="preset-btn" data-speed="100">Slow (100ms)</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Right Column: Drop Zone & Configuration -->
    <section class="card config-card">
      <div class="card-header">
        <h2>Media & Upload</h2>
      </div>

      <!-- Drag & Drop Zone -->
      <div id="dropZone" class="drop-zone">
        <input type="file" id="fileInput" accept=".gif,.png,.jpg,.jpeg,.bmp,.webp" class="file-input">
        <div class="drop-prompt">
          <div class="upload-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="17 8 12 3 7 8" />
              <line x1="12" y1="3" x2="12" y2="15" />
            </svg>
          </div>
          <p class="drop-main-text">Drag & drop your GIF or Image here</p>
          <p class="drop-sub-text">or <span class="highlight-link">browse from your Mac</span> (GIF, PNG, JPG, BMP)</p>
        </div>
        <div id="fileLoadedInfo" class="file-loaded-info hidden">
          <div class="file-info-row">
            <span id="loadedFileName" class="file-name">filename.gif</span>
            <span id="loadedFileMeta" class="file-meta">16 frames • 96×160</span>
          </div>
        </div>
      </div>

      <!-- Controls Form -->
      <div class="form-section">
        <div class="form-group">
          <label class="form-label">Rotation</label>
          <div class="segmented-control" id="rotationControl">
            <button class="segment-btn active" data-rotation="0">0°</button>
            <button class="segment-btn" data-rotation="90">90° ↻</button>
            <button class="segment-btn" data-rotation="180">180°</button>
            <button class="segment-btn" data-rotation="270">270° ↻</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Fit Mode</label>
          <div class="segmented-control" id="fitModeControl">
            <button class="segment-btn active" data-fit="cover">Cover (Fill)</button>
            <button class="segment-btn" data-fit="contain">Contain (Fit)</button>
            <button class="segment-btn" data-fit="stretch">Stretch</button>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="slotSelect">Target LCD Slot</label>
            <select id="slotSelect" class="select-input">
              <option value="1">Slot 1 (Custom 1)</option>
              <option value="2">Slot 2 (Custom 2)</option>
            </select>
          </div>

          <div class="form-group" id="maxFramesGroup">
            <label class="form-label" for="maxFramesInput">Max Frames</label>
            <select id="maxFramesInput" class="select-input">
              <option value="0">All Frames</option>
              <option value="30">30 Frames (Faster)</option>
              <option value="60">60 Frames</option>
              <option value="80" selected>80 Frames (Recommended)</option>
              <option value="100">100 Frames</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Upload Action -->
      <div class="upload-action-area">
        <button id="btnUpload" class="btn btn-primary btn-large" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />
            <line x1="12" y1="3" x2="12" y2="15" />
          </svg>
          <span id="uploadBtnText">Upload to Keyboard LCD</span>
        </button>

        <!-- Progress Box -->
        <div id="progressBox" class="progress-box hidden">
          <div class="progress-bar-container">
            <div id="progressBar" class="progress-bar" style="width: 0%"></div>
          </div>
          <div class="progress-details">
            <span id="progressMessage">Preparing transfer...</span>
            <span id="progressPercent">0%</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
